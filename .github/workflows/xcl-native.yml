name: XCL mesh plus watchdog Windows x64
on:
  push:
    branches: ["build/xcl-mesh-watchdog-20261124"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xcl-dev/xcl
          ref: 9e3831e1f570d3646e53ab753b19ec07eb8f1485
          path: xcl
          persist-credentials: false
      - name: Integrate only reviewed mesh changes on known-good upstream
        working-directory: xcl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "XCL Integration CI"
          git config user.email "xcl-integration@users.noreply.github.com"
          git fetch --no-tags --depth=8 https://github.com/ryosen0/xcl.git 6bd8f641040071b8a388c0ec3053c2b1483ddcdf
          if ($LASTEXITCODE -ne 0) { throw 'Fetch of pinned PR failed' }
          $commits = @(
            '301adaea6240613638f51c0d2ed920a47b9d6121',
            'd42b820efd6369488ef1bcf4af3c8fa33937caea',
            '2915f227936deaa33050692712884da7585b8424',
            '70f91859a82bfb1aa2e35399203af90d104cb87c',
            '48c1517a0c48a5a9cf890c67c5b3a61438e70cd4',
            '7654a2a4eaba17d8252b686149600721b76489b7',
            '6bd8f641040071b8a388c0ec3053c2b1483ddcdf'
          )
          foreach ($commit in $commits) {
            git cherry-pick -x $commit
            if ($LASTEXITCODE -ne 0) { git status --short; throw "Conflict integrating $commit; no artifact built" }
          }
          git diff --stat 9e3831e1f570d3646e53ab753b19ec07eb8f1485 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify integration' }
      - name: Restore pinned watchdog hold without skipping dispatches
        working-directory: xcl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags --depth=2 https://github.com/imnicho/xcl.git 9cdae10f0bdf21b64a80958a87498b8f8124ac1d
          if ($LASTEXITCODE -ne 0) { throw 'Fetch of pinned watchdog correction failed' }
          git cherry-pick -x 9cdae10f0bdf21b64a80958a87498b8f8124ac1d
          if ($LASTEXITCODE -ne 0) { git status --short; throw 'Watchdog integration conflict; no artifact built' }
          if (-not (Get-Content crates/xcl/src/hle/d3d12x/pso_async.rs -Raw).Contains('pub fn title_held()')) { throw 'Pipeline hold missing' }
          if (-not (Get-Content crates/xcl/src/hle/kernelx.rs -Raw).Contains('pub unsafe extern "system" fn Sleep(ms: u32)')) { throw 'Title Sleep export missing' }
          git diff --stat HEAD~1 HEAD
      - name: Set up Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
      - name: Build native XCL
        working-directory: xcl
        run: cargo build --locked --release -p xcl
      - name: Smoke test
        working-directory: xcl
        run: |
          & target/release/xcl.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'XCL version check failed' }
      - name: Build full workspace for end-to-end tests
        working-directory: xcl
        run: cargo build --locked --workspace
      - name: Upstream CI suite with documented no-GPU exception
        working-directory: xcl
        shell: pwsh
        run: |
          cargo test --locked --workspace -- --test-threads=4 --skip test_title_runs_and_game_folder_is_untouched 2>&1 | Tee-Object -FilePath ci-tests.log
          if ($LASTEXITCODE -ne 0) { throw "Test suite failed: $LASTEXITCODE" }
      - name: Locate compiled library test harness
        working-directory: xcl
        shell: pwsh
        run: |
          $items = @(cargo test --locked -p xcl --lib --no-run --message-format=json | ForEach-Object {
            try { $item = $_ | ConvertFrom-Json } catch { return }
            if ($item.reason -eq 'compiler-artifact' -and $item.target.name -eq 'xcl' -and $item.profile.test -and $item.executable) { $item.executable }
          })
          if ($LASTEXITCODE -ne 0 -or $items.Count -ne 1) { throw 'Cannot locate unique compiled library test executable' }
          $items[0] | Set-Content -Encoding utf8 $env:RUNNER_TEMP/xcl-test-path.txt
      - name: Package standalone runtime and corresponding source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item xcl/target/release/xcl.exe,xcl/LICENSE,xcl/README.md dist
          Copy-Item xcl/ci-tests.log dist/CI-TESTS.log
          New-Item -ItemType Directory -Path dist/tests | Out-Null
          $testExe = (Get-Content $env:RUNNER_TEMP/xcl-test-path.txt -Raw).Trim()
          Copy-Item -LiteralPath $testExe -Destination dist/tests/xcl-tests.exe
          Copy-Item -LiteralPath xcl/tests/data/testgame -Destination dist/tests/testgame -Recurse
          Copy-Item xcl/target/debug/xcl_testtitle.exe,xcl/target/debug/testgame_mw.dll dist/tests/testgame
          @'
          Base: xcl-dev/xcl 9e3831e1f570d3646e53ab753b19ec07eb8f1485
          Mesh: PR 541, seven commits through 6bd8f641040071b8a388c0ec3053c2b1483ddcdf
          Watchdog: PR 1288, 9cdae10f0bdf21b64a80958a87498b8f8124ac1d
          Launcher: async=1, lazy=1, preload=0, DXC workers=6, sleep hold=100ms, no bind timeout, activity logging enabled.
          CI-TESTS.log contains actual CI test output; GPU skips are not GPU coverage.
          As in upstream CI, test_title_runs_and_game_folder_is_untouched is filtered out because the hosted runner has no supported GPU. The included tests/testgame fixture allows a real-GPU check locally.
          This integration is intended to prevent the title's stall check counting time held in a pipeline build. Reaching gameplay is not established.
          GPU test harness: set XCL_DXC_DIR to this directory, then run tests/xcl-tests.exe --test-threads=4 --nocapture.
          Integration prepared in ChatGPT Work by Codex (GPT-6). Runtime corrections retain their upstream authors and source provenance.
          '@ | Set-Content -Encoding utf8 dist/BUILD-INFO.txt
          @'
          @echo off
          setlocal
          set "XCL_ASYNC_PSO=1"
          set "XCL_LAZY_PSO=1"
          set "XCL_PSO_PRELOAD=0"
          set "XCL_DXC_THREADS=6"
          set "XCL_SLEEP_HOLD=100"
          set "XCL_PSO_WAIT_MS=0"
          set "XCL_ACTIVITY=1"
          set "GAME=%~1"
          if not defined GAME set "GAME=D:\GTA6\GTA6.Xbox.v1.0.2.1-CYBERLEEK"
          if not defined GAME exit /b 2
          set "GAME=%GAME:"=%"
          if not exist "%GAME%" (
            echo Path not found.
            pause
            exit /b 2
          )
          "%~dp0xcl.exe" run "%GAME%"
          set "RC=%ERRORLEVEL%"
          echo XCL exit code: %RC%
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ascii dist/XCL-Performance.cmd
          $dxcZip = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $dxcDir = Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/dxc_2025_07_14.zip' -OutFile $dxcZip
          if ((Get-FileHash $dxcZip -Algorithm SHA256).Hash -ne '9ad895a6b039e3a8f8c22a1009f866800b840a74b50db9218d13319e215ea8a4') { throw 'DXC SHA256 mismatch' }
          Expand-Archive $dxcZip -DestinationPath $dxcDir -Force
          Copy-Item "$dxcDir/bin/x64/dxcompiler.dll","$dxcDir/bin/x64/dxil.dll" dist -Force
          New-Item -ItemType Directory dist/DXC-notices | Out-Null
          Get-ChildItem $dxcDir -File | Where-Object { $_.Name -match 'license|notice|readme' } | Copy-Item -Destination dist/DXC-notices
          if (Test-Path xcl/target/release/xcl.pdb) { Copy-Item xcl/target/release/xcl.pdb dist }
          git -C xcl rev-parse HEAD | Set-Content dist/UPSTREAM-COMMIT.txt
          git -C xcl archive --format=zip --output="$env:GITHUB_WORKSPACE/dist/xcl-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Substring((Resolve-Path dist).Path.Length + 1))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xcl-mesh-watchdog-performance-windows-x64
          path: dist/
          if-no-files-found: error
