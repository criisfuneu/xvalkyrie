name: Upstream Windows build 0.0.8
on:
  push:
    branches: [upstream-build-0.0.8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sammwyy/xvalkyrie
          ref: 4e02c6815d254764a266a2de30994d96cfaef0b0
          path: upstream
          persist-credentials: false
      - name: Configure
        run: cmake -S upstream -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Run upstream tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package binaries and license
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist | Out-Null
          $exe = Get-ChildItem build -Recurse -File -Filter xvalkyrie.exe | Select-Object -First 1
          if (-not $exe) { throw 'Missing xvalkyrie.exe' }
          Copy-Item "$($exe.Directory.FullName)\*" dist -Recurse -Force
          if (-not (Test-Path dist/xvboot.exe)) { throw 'Missing xvboot.exe' }
          Copy-Item upstream/LICENSE,upstream/THIRD-PARTY.md,upstream/README.md dist
          git -C upstream archive --format=zip --output="$env:GITHUB_WORKSPACE/source.zip" HEAD
          Get-ChildItem dist -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Substring((Resolve-Path dist).Path.Length + 1))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xvalkyrie-0.0.8-windows-x64
          path: |
            dist/
            source.zip
          if-no-files-found: error
