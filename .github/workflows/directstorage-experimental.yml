name: Leonida x XValkyrie experimental hybrid
on:
  push:
    branches:
      - experiment/leonida-hybrid
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem build -Recurse -File -Filter xvboot.exe | Where-Object { $_.FullName -match '\\Release\\' } | ForEach-Object { Copy-Item $_.FullName artifact/xvboot.exe }
          if (-not (Test-Path artifact/xvboot.exe)) { throw "xvboot.exe not found" }
      - uses: actions/upload-artifact@v4
        with:
          name: xvboot-leonida-hybrid
          path: artifact/xvboot.exe
          if-no-files-found: error
