name: Build updated XCL and mesh-preview for Windows

on:
  push:
    branches:
      - xcl-modern-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-xcl:
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant: [updated-main, mesh-preview, dstorage-preview]
    steps:
      - name: Checkout project fixes
        uses: actions/checkout@v4
      - name: Checkout pinned upstream XCL
        shell: pwsh
        run: |
          git clone --no-checkout https://github.com/ivall/xcl.git xcl-src
          if ('${{ matrix.variant }}' -eq 'updated-main') {
            $sha = '47efa2ecea0a12934719ae69b81930cf02a4b1c3'
            git -C xcl-src checkout $sha
          } elseif ('${{ matrix.variant }}' -eq 'mesh-preview') {
            # PR commits may not be reachable from main, so fetch the PR ref explicitly
            git -C xcl-src fetch origin pull/541/head
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch PR 541' }
            git -C xcl-src checkout FETCH_HEAD
            $sha = (git -C xcl-src rev-parse HEAD).Trim()
          } else {
            git -C xcl-src fetch origin pull/979/head
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch PR 979' }
            git -C xcl-src checkout FETCH_HEAD
            $sha = (git -C xcl-src rev-parse HEAD).Trim()
          }
          if ($LASTEXITCODE -ne 0) { throw "Cannot checkout $sha" }
          Write-Output "Source: $sha"
      - name: Keep fixed-base FidelityFX and xmem loader fixes
        shell: pwsh
        run: py experimental/xcl/apply_fix.py xcl-src
      - name: Build updated XCL
        shell: pwsh
        working-directory: xcl-src
        run: |
          rustc --version
          cargo build --release -p xcl --locked
      - name: Run XCL unit tests
        shell: pwsh
        working-directory: xcl-src
        run: cargo test -p xcl --lib --locked -- --test-threads=4
      - name: Package executable, provenance and instructions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item xcl-src/target/release/xcl.exe output/
          Copy-Item xcl-src/LICENSE output/
          $sha = (git -C xcl-src rev-parse HEAD).Trim()
          New-Item -ItemType Directory -Force output/launcher | Out-Null
          Copy-Item experimental/launcher/* output/launcher/
          "Upstream: ivall/xcl`nSource commit: $sha`nVariant: ${{ matrix.variant }}`nLocal modifications: experimental/xcl/apply_fix.py`nNo game files or Microsoft SDK files included." |
            Set-Content output/build-info.txt -Encoding UTF8
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: xcl-${{ matrix.variant }}-20261124
          path: output/
          if-no-files-found: error
          retention-days: 7

  launcher-standalone:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout launcher's source
        uses: actions/checkout@v4
      - name: Package launcher scripts
        shell: pwsh
        run: |
          if (-not (Test-Path experimental/launcher/XValLauncher.ps1)) { throw 'Missing launcher' }
          New-Item -ItemType Directory -Force launcher | Out-Null
          Copy-Item experimental/launcher/* launcher/
      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: xval-launcher-windows-20261124
          path: launcher/
          if-no-files-found: error
          retention-days: 14
